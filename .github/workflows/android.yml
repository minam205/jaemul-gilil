name: 안드로이드 앱 빌드
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: APK 만들기
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle -p android assembleDebug --no-daemon
      - name: 파일 이름 정리
        run: cp android/app/build/outputs/apk/debug/app-debug.apk lotto-good-day.apk
      - uses: actions/upload-artifact@v4
        with:
          name: lotto-good-day-apk
          path: lotto-good-day.apk
          retention-days: 30
